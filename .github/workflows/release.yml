name: Release

# Запускается тегом vX.Y.Z; версия тега должна совпадать с appVersionName в gradle.properties.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4

      - name: Check tag matches appVersionName
        run: |
          expected="v$(grep '^appVersionName=' gradle.properties | cut -d= -f2)"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match gradle.properties ($expected)"; exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Test and build signed release
        env:
          MININOTE_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          MININOTE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MININOTE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MININOTE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease bundleRelease

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
